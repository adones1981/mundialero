<!DOCTYPE html>

    <!-- Tailwind CSS para el diseño moderno -->

    <!-- FontAwesome para los íconos de balones y estadios -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Animación de la pelota rodando como el mundo al ingresar */
        @keyframes rodarMundo {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(0.2); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(-50%, -50%) rotate(1440deg) scale(1); opacity: 0; pointer-events: none; }
        }
        .loader-ball {
            animation: rodarMundo 3.5s ease-in-out forwards;
        }
        /* Textura de césped para el fondo del estadio */
        .cesped {
            background-color: #115e59;
            background-image: linear-gradient(rgba(255,255,255,0.05) 50%, transparent 50%),
                              linear-gradient(90deg, rgba(255,255,255,0.05) 50%, transparent 50%);
            background-size: 80px 80px;
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans overflow-x-hidden">

    <!-- PANTALLA DE INICIO (Loader de la Pelota Mundo) -->
    <div id="loader" class="fixed inset-0 bg-black z-50 flex items-center justify-center transition-opacity duration-1000">
        <div class="text-center">
            <div class="relative w-64 h-64 mx-auto">
                <i class="fa-solid fa-soccer-ball text-8xl text-emerald-400 absolute top-1/2 left-1/2 loader-ball"></i>
            </div>
            <h1 class="text-3xl font-bold mt-8 tracking-wider text-emerald-400 animate-pulse">INGRESANDO AL ESTADIO...</h1>
            <p class="text-emerald-500 mt-2"><i class="fa-solid fa-whistle mr-2"></i> Prepárate para el pitazo inicial</p>
        </div>
    </div>

    <!-- Elementos de audio para el ambiente del estadio -->

    </audio>
    <audio id="sonidoPitazo">

            <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-stadium text-3xl text-emerald-400"></i>
                    <h1 class="text-xl md:text-3xl font-extrabold tracking-widest text-emerald-400 uppercase">Estadísticas de los Mundiales</h1>
                </div>
                <!-- Botón de Sonido -->
                <button onclick="alternarAudio()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 px-5 rounded-full flex items-center gap-2 transition shadow-lg shadow-emerald-500/20">

                </button>
            </div>
        </header>

        <!-- Cancha / Contenedor de la Tribuna -->
        <main class="cesped flex-grow p-4 md:p-8 relative">
            <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-11/12 h-8 border-b-2 border-x-2 border-white/10 pointer-events-none flex justify-center items-end">

                    <label class="block text-sm font-bold uppercase mb-2 text-emerald-400"><i class="fa-solid fa-calendar-days mr-2"></i> Seleccionar Edición Histórica:</label>

                        <!-- Opciones generadas en JS -->

        </main>

                { name: "Bolivia", pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 },
                { name: "Guatemala", pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 }
              ]},
              { name: "Grupo J", teams: [
                { name: "Uruguay", pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 },
                { name: "Colombia", pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 },
                { name: "Turquía", pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 },
                { name: "Georgia", pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 }
              ]},
              { name: "Grupo K", teams: [
                { name: "Polonia", pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 },
                { name: "Arabia Saudí", pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 },
                { name: "Croacia", pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 },
                { name: "Eslovenia", pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 }
              ]},
              { name: "Grupo L", teams: [
                { name: "Portugal", pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 },
                { name: "África Sub.", pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 },
                { name: "Rep. Checa", pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 },
                { name: "Concacaf TBD", pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 }
              ]}
            ],
            knockout: []
          }
        ];

        // Lógica de llenado del Selector dinámico
        const select = document.getElementById('selectAnio');
        WORLDCUPS.forEach(m => {
            const option = document.createElement('option');
            option.value = m.year;
            option.textContent = `${m.year} - Sede: ${m.host} ${m.isLive ? '🔥 (En Curso)' : ''}`;
            select.appendChild(option);
        });

        document.getElementById('selectAnio').value = "2026";

        window.addEventListener('DOMContentLoaded', () => {
            buscarMundial();
            setTimeout(() => {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    document.getElementById('sonidoPitazo').play().catch(() => {});
                    setTimeout(() => loader.remove(), 1000);
                }
            }, 3500);
        });

        let audioActivo = false;
        const sonidoAmbiente = document.getElementById('sonidoAmbiente');
        const iconoAudio = document.getElementById('iconoAudio');
        const textoAudio = document.getElementById('textoAudio');

        function alternarAudio() {
            if (!audioActivo) {
                sonidoAmbiente.play().catch(() => {});
                iconoAudio.className = "fa-solid fa-volume-high text-emerald-400 animate-pulse";
                textoAudio.innerText = "Mutear Estadio";
                audioActivo = true;
            } else {
                sonidoAmbiente.pause();
                iconoAudio.className = "fa-solid fa-volume-mute";
                textoAudio.innerText = "Activar Sonido Ambiente";
                audioActivo = false;
            }
        }

        function cambiarPestana(tipo) {
            pestanaActiva = tipo;
            buscarMundial();
        }

        function buscarMundial() {
            const anioSeleccionado = parseInt(document.getElementById('selectAnio').value);
            const contenedor = document.getElementById('vistaContenido');
            
            const data = WORLDCUPS.find(m => m.year === anioSeleccionado);
            if (!data) return;

            // Renderizar Fase de Grupos sin banderas ni abreviaturas
            let htmlGrupos = '';
            data.groups.forEach(g => {
                htmlGrupos += `
                    <div class="bg-slate-800/90 p-4 rounded-xl border border-emerald-500/30 shadow-md">
                        <h4 class="font-black text-emerald-400 border-b border-slate-700 pb-2 mb-3 uppercase tracking-wide flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-list-ol"></i> ${g.name}
                        </h4>
                        <table class="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr class="text-slate-400 border-b border-slate-700 uppercase">
                                    <th class="pb-1">Selección</th>
                                    <th class="pb-1 text-center">Pts</th>
                                    <th class="pb-1 text-center">PJ</th>
                                    <th class="pb-1 text-center">PG</th>
                                    <th class="pb-1 text-center">GF</th>
                                    <th class="pb-1 text-center">GC</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${g.teams.map((t, index) => {
                                    return `
                                        <tr class="border-b border-slate-900/60 hover:bg-slate-700/30">
                                            <td class="font-bold py-2 text-white flex items-center gap-1">
                                                <span class="text-slate-500 font-mono w-4">${index + 1}.</span> ${t.name}
                                            </td>
                                            <td class="text-emerald-400 font-black text-center text-sm">${t.pts}</td>
                                            <td class="text-center text-slate-300">${t.pj || (t.w + t.d + t.l)}</td>
                                            <td class="text-center text-slate-300">${t.w}</td>
                                            <td class="text-center text-slate-400">${t.gf}</td>
                                            <td class="text-center text-slate-400">${t.ga}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            });

            // Cuadro de Torneo de Fútbol Puro Vertical (De arriba hacia abajo)
            let htmlKnockout = '';
            if (data.knockout && data.knockout.length > 0) {
                htmlKnockout = `<div class="bg-slate-950 p-6 rounded-2xl border-2 border-emerald-500/40 space-y-6 flex flex-col items-center">`;
                data.knockout.forEach(fase => {
                    htmlKnockout += `
                        <div class="w-full max-w-2xl border-b border-slate-800 pb-4 last:border-b-0">
                            <h5 class="text-xs font-black tracking-widest text-emerald-400 uppercase mb-3 flex items-center justify-center gap-2">
                                <i class="fa-solid fa-trophy text-emerald-500"></i> ${fase.round}
                            </h5>
                            <div class="flex flex-col gap-3">
                                ${fase.matches.map(m => {
                                    return `
                                        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800/80 flex justify-between items-center text-xs font-semibold shadow-inner">
                                            <div class="flex items-center gap-2 w-5/12">
                                                <span class="text-slate-100 truncate">${m.home}</span>
                                            </div>
                                            <div class="bg-emerald-950/80 text-emerald-400 font-mono font-black px-4 py-1.5 rounded-lg border border-emerald-500/20 text-center min-w-[80px] text-sm">
                                                ${m.score}
                                            </div>
                                            <div class="flex items-center gap-2 w-5/12 justify-end text-right">
                                                <span class="text-slate-100 truncate">${m.away}</span>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                });
                
                // Módulo de Campeón Destacado al final del Árbol
                htmlKnockout += `
                    <div class="w-full max-w-sm bg-gradient-to-b from-slate-900 to-slate-950 p-4 rounded-xl border-2 border-emerald-400 text-center shadow-2xl mt-4">
                        <span class="text-[10px] text-slate-400 block font-bold tracking-wider uppercase"><i class="fa-solid fa-crown text-emerald-400"></i> Campeón del Mundo</span>
                        <div class="text-lg font-black text-emerald-400 uppercase mt-1 drop-shadow-[0_0_8px_rgba(52,211,153,0.4)]">
                            ${data.champion} 👑
                        </div>
                    </div>
                `;
                htmlKnockout += `</div>`;
            } else {
                htmlKnockout = `
                    <div class="text-center py-12 bg-slate-900/60 border border-slate-800 rounded-xl text-slate-400 text-sm font-bold uppercase">
                        <i class="fa-solid fa-circle-info text-emerald-400 mr-1"></i> Las llaves de play-offs se configurarán automáticamente al concluir la Fase de Grupos.
                    </div>`;
            }

            contenedor.innerHTML = `
                <div class="space-y-6">
                    
                    <!-- Marcador LED / Copa fija en el logo izquierdo -->
                    <div class="bg-gradient-to-r from-emerald-800 to-teal-950 text-white p-5 rounded-2xl shadow-xl border-2 border-emerald-500 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-4">
                            <div class="text-4xl bg-slate-900/80 p-3 rounded-2xl border border-emerald-400/30 shadow-inner">🏆</div>
                            <div>
                                <h3 class="text-2xl font-black tracking-tighter uppercase text-emerald-400"><i class="fa-solid fa-trophy mr-1"></i> MUNDIAL ${data.year}</h3>
                                <p class="text-xs uppercase tracking-widest font-bold text-slate-300"><i class="fa-solid fa-map-location-dot"></i> Organiza: ${data.host}</p>
                            </div>
                        </div>
                        <div class="bg-slate-950 text-emerald-400 px-5 py-3 rounded-xl border border-emerald-500/50 font-mono text-xs shadow-inner min-w-[250px]">
                            <p class="flex justify-between"><span>🥇 CAMPEÓN:</span> <span class="text-white font-bold">${data.champion}</span></p>
                            <p class="flex justify-between mt-1"><span>🥈 SUB-CAMPEÓN:</span> <span class="text-slate-300">${data.runner_up}</span></p>
                            <p class="flex justify-between mt-1"><span>🥉 TERCERO:</span> <span class="text-slate-400">${data.third || 'TBD'}</span></p>
                        </div>
                    </div>

                    <!-- Ficha Balón Oficial -->
                    <div class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center justify-start gap-4 shadow">
                        <div class="bg-emerald-500/10 p-3 rounded-full text-emerald-400 text-2xl flex-shrink-0">
                            <i class="fa-solid fa-soccer-ball"></i>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Balón de la Edición</p>
                            <p class="text-base font-black text-white">${data.ball}</p>
                        </div>
                    </div>

                    <!-- Pestañas del Estadio -->
                    <div class="flex border-b-2 border-slate-800 gap-2">
                        <button onclick="cambiarPestana('grupos')" class="py-2 px-5 font-black text-xs uppercase tracking-widest rounded-t-lg transition border-t-2 border-x-2 ${pestanaActiva === 'grupos' ? 'bg-slate-800 text-emerald-400 border-emerald-500' : 'bg-transparent text-slate-500 border-transparent hover:text-slate-300'}">
                            <i class="fa-solid fa-table-cells mr-1"></i> Tablas de Grupos
                        </button>
                        <button onclick="cambiarPestana('eliminatoria')" class="py-2 px-5 font-black text-xs uppercase tracking-widest rounded-t-lg transition border-t-2 border-x-2 ${pestanaActiva === 'eliminatoria' ? 'bg-slate-800 text-emerald-400 border-emerald-500' : 'bg-transparent text-slate-500 border-transparent hover:text-slate-300'}">
                            <i class="fa-solid fa-diagram-project mr-1"></i> Fase Eliminatoria
                        </button>
                    </div>

                    <!-- Contenido de Pestañas Dinámicas -->
                    <div>
                        ${pestanaActiva === 'grupos' ? `
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${htmlGrupos}</div>
                        ` : `
                            <div>${htmlKnockout}</div>
                        `}
                    </div>

                </div>
            `;
        }
    </script>
</body>
</html>
