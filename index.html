<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Historia de los Mundiales FIFA 1930-2026</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div id="loader">

<div class="ball"></div>

<h2>Cargando Mundial FIFA...</h2>

</div>

<header>

<div class="overlay">

<h1>⚽ FIFA WORLD CUP HISTORY</h1>

<p>Todos los Mundiales desde 1930 hasta 2026</p>

<select id="yearSelector">
<option value="">Selecciona un Mundial</option>
</select>

</div>

</header>

<nav>

<button onclick="showSection('info')">Información</button>

<button onclick="showSection('groups')">Grupos</button>

<button onclick="showSection('knockout')">Eliminatorias</button>

<button onclick="showSection('stats')">Estadísticas</button>

<button onclick="showSection('timeline')">Timeline</button>

</nav>

<section id="info" class="content">

<div class="card">

<h2 id="wcTitle">
Selecciona un Mundial
</h2>

<div class="info-grid">

<div>
<h3>Sede</h3>
<p id="host"></p>
</div>

<div>
<h3>Campeón</h3>
<p id="champion"></p>
</div>

<div>
<h3>Subcampeón</h3>
<p id="runnerup"></p>
</div>

<div>
<h3>Balón Oficial</h3>
<p id="ball"></p>
</div>

<div>
<h3>Canción Oficial</h3>
<p id="song"></p>
</div>

<div>
<h3>Participantes</h3>
<p id="teams"></p>
</div>

</div>

</div>

</section>

<section id="groups" class="content hidden">

<h2>Fase de Grupos</h2>

<div id="groupsContainer"></div>

</section>

<section id="knockout" class="content hidden">

<h2>Fase Eliminatoria</h2>

<div id="bracketContainer"></div>

</section>

<section id="stats" class="content hidden">

<h2>Estadísticas</h2>

<canvas id="statsChart"></canvas>

</section>

<section id="timeline" class="content hidden">

<h2>Línea de Tiempo</h2>

<div id="timelineContainer"></div>

</section>

<footer>

<p>
© FIFA World Cup History 1930-2026
</p>

</footer>

<script src="script.js"></script>

</body>
</html>
