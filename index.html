<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundial Stats - El Estadio de la Historia</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes rodarMundo {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(0.2); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(-50%, -50%) rotate(1440deg) scale(1); opacity: 0; pointer-events: none; }
        }
        .loader-ball { animation: rodarMundo 3.5s ease-in-out forwards; }
        .cesped {
            background-color: #115e59;
            background-image: linear-gradient(rgba(255,255,255,0.05) 50%, transparent 50%),
                              linear-gradient(90deg, rgba(255,255,255,0.05) 50%, transparent 50%);
            background-size: 80px 80px;
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans overflow-x-hidden">

    <div id="loader" class="fixed inset-0 bg-black z-50 flex items-center justify-center transition-opacity duration-1000">
        <div class="text-center">
            <div class="relative w-64 h-64 mx-auto">
                <i class="fa-solid fa-soccer-ball text-8xl text-emerald-400 absolute top-1/2 left-1/2 loader-ball"></i>
            </div>
            <h1 class="text-3xl font-bold mt-8 tracking-wider text-emerald-400 animate-pulse">INGRESANDO AL ESTADIO...</h1>
            <p class="text-emerald-500 mt-2"><i class="fa-solid fa-whistle mr-2"></i> Prepárate para el pitazo inicial</p>
        </div>
    </div>

    <audio id="sonidoAmbiente" loop><source src="https://assets.mixkit.co/active_storage/sfx/2034/2034-84.wav" type="audio/wav"></audio>
    <audio id="sonidoPitazo"><source src="https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav" type="audio/wav"></audio>

    <div class="min-h-screen flex flex-col">
        <header class="bg-slate-900 border-b-4 border-emerald-500 p-4 shadow-2xl">
            <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-stadium text-3xl text-emerald-400"></i>
                    <h1 class="text-xl md:text-3xl font-extrabold tracking-widest text-emerald-400 uppercase">Estadísticas de los Mundiales</h1>
                </div>
                <button onclick="alternarAudio()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 px-5 rounded-full flex items-center gap-2 transition shadow-lg">
                    <i id="iconoAudio" class="fa-solid fa-volume-mute"></i> <span id="textoAudio">Activar Sonido Ambiente</span>
                </button>
            </div>
        </header>

        <main class="cesped flex-grow p-4 md:p-8 relative">
            <div class="container mx-auto max-w-7xl bg-slate-900/85 backdrop-blur-md rounded-3xl p-6 border-4 border-emerald-500/30 shadow-2xl mt-4">
                
                <div class="bg-emerald-950/40 p-4 rounded-xl border border-emerald-500/50 mb-6">
                    <label class="block text-sm font-bold uppercase mb-2 text-emerald-400"><i class="fa-solid fa-calendar-days mr-2"></i> Seleccionar Edición Histórica:</label>
                    <select id="selectAnio" onchange="buscarMundial()" class="w-full bg-slate-800 text-white border-2 border-emerald-500 p-3 rounded-lg font-bold text-lg cursor-pointer">
                        <option value="">Cargando base de datos del estadio...</option>
                    </select>
                </div>

                <div id="vistaContenido" class="min-h-[500px] transition-all duration-300"></div>
            </div>
        </main>

        <footer class="bg-slate-950 text-center p-4 border-t-4 border-emerald-700 text-slate-500 text-xs">
            <p><i class="fa-solid fa-bullhorn text-emerald-500 mr-2"></i> Enciclopedia Rigurosa del Fútbol Mundial.</p>
        </footer>
    </div>

    <script>
        let mundialDB = null;
        let pestanaActiva = 'grupos';

        // Cargar Base de Datos Externa JSON
        async function cargarBaseDeDatos() {
            try {
                const respuesta = await fetch('mundiales.json');
                mundialDB = await respuesta.json();
                
                const select = document.getElementById('selectAnio');
                select.innerHTML = '';
                
                Object.keys(mundialDB).forEach(anio => {
                    const option = document.createElement('option');
                    option.value = anio;
                    option.textContent = `${anio} ${anio === "2026" ? "(Edición en Curso)" : `(${mundialDB[anio].host})`}`;
                    select.appendChild(option);
                });

                select.value = "2026";
                buscarMundial();
            } catch (error) {
                document.getElementById('vistaContenido').innerHTML = `<p class="text-red-500 font-bold text-center">Error al conectar con mundiales.json. Verifica que el archivo exista en tu repositorio.</p>`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            cargarBaseDeDatos();
            setTimeout(() => {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    document.getElementById('sonidoPitazo').play().catch(() => {});
                    setTimeout(() => loader.remove(), 1000);
                }
            }, 3500);
        });

        let audioActivo = false;
        function alternarAudio() {
            const sonido = document.getElementById('sonidoAmbiente');
            if (!audioActivo) {
                sonis.play().catch(() => {});
                document.getElementById('iconoAudio').className = "fa-solid fa-volume-high text-emerald-400 animate-pulse";
                document.getElementById('textoAudio').innerText = "Mutear Estadio";
                audioActivo = true;
            } else {
                sonido.pause();
                document.getElementById('iconoAudio').className = "fa-solid fa-volume-mute";
                document.getElementById('textoAudio').innerText = "Activar Sonido Ambiente";
                audioActivo = false;
            }
        }

        function cambiarPestana(tipo) {
            pestanaActiva = tipo;
            buscarMundial();
        }

        function verVideo(id) { window.open(`https://www.youtube.com/watch?v=${id}`, '_blank'); }

        function buscarMundial() {
            if (!mundialDB) return;
            const anio = document.getElementById('selectAnio').value;
            const contenedor = document.getElementById('vistaContenido');
            const data = mundialDB[anio];

            let htmlGrupos = '';
            for (const [grupo, equipos] of Object.entries(data.grupos || {})) {
                htmlGrupos += `
                    <div class="bg-slate-800/90 p-4 rounded-xl border border-emerald-500/30">
                        <h4 class="font-black text-emerald-400 border-b border-slate-700 pb-2 mb-3 text-sm uppercase"><i class="fa-solid fa-list-ol"></i> ${grupo}</h4>
                        <table class="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr class="text-slate-400 border-b border-slate-700 uppercase">
                                    <th>País</th><th class="text-center">Pts</th><th class="text-center">PJ</th><th class="text-center">PG</th><th class="text-center">PE</th><th class="text-center">PP</th><th class="text-center">GF</th><th class="text-center">GC</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${equipos.map((e, i) => `
                                    <tr class="border-b border-slate-900/60 hover:bg-slate-700/30">
                                        <td class="font-bold py-2"><span class="text-slate-500 font-mono">${i+1}.</span> ${e.pais}</td>
                                        <td class="text-emerald-400 font-black text-center">${e.pts}</td>
                                        <td class="text-center">${e.pj}</td>
                                        <td class="text-center">${e.pg}</td>
                                        <td class="text-center">${e.pe}</td>
                                        <td class="text-center">${e.pp}</td>
                                        <td class="text-center text-slate-400">${e.gf}</td>
                                        <td class="text-center text-slate-400">${e.gc}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            let htmlArbol = '';
            if (data.arbolEliminatorio) {
                const arb = data.arbolEliminatorio;
                htmlArbol = `
                    <div class="bg-slate-950 p-6 rounded-2xl border-2 border-emerald-500/40 grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="space-y-4">
                            <h5 class="text-xs font-black tracking-widest text-emerald-400 uppercase border-b border-slate-800 pb-1 text-center">Fase de Llaves</h5>
                            ${arb.faseInicial.map(c => `
                                <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800 space-y-1 text-xs">
                                    <div class="font-bold">${c.local}</div>
                                    <div class="bg-emerald-950/60 text-emerald-400 font-mono font-black py-0.5 text-center rounded border border-emerald-800/40">${c.res}</div>
                                    <div class="font-bold">${c.visita}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="space-y-4 lg:pt-12">
                            <h5 class="text-xs font-black tracking-widest text-emerald-400 uppercase border-b border-slate-800 pb-1 text-center">Semifinales</h5>
                            ${arb.semis.map(s => `
                                <div class="bg-slate-900 p-3 rounded-lg border border-emerald-500/30 space-y-1 text-xs">
                                    <div class="font-bold text-slate-200">${s.local}</div>
                                    <div class="bg-slate-950 text-center py-1 font-mono text-emerald-400 font-bold rounded">${s.res}</div>
                                    <div class="font-bold text-slate-200">${s.visita}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="flex flex-col justify-center items-center space-y-4">
                            <h5 class="text-xs font-black tracking-widest text-emerald-400 uppercase border-b border-slate-800 pb-1 w-full text-center">Gran Final</h5>
                            <div class="w-full bg-slate-900 p-4 rounded-xl border-2 border-emerald-400 shadow-xl text-center space-y-2">
                                <div class="text-xs font-bold space-y-1">
                                    <p>${arb.final.local}</p>
                                    <p class="text-sm font-black text-emerald-400 my-1 bg-emerald-950/60 py-1 rounded">${arb.final.res}</p>
                                    <p>${arb.final.visita}</p>
                                </div>
                                <div class="pt-3 border-t border-slate-800 mt-2">
                                    <span class="text-[10px] text-slate-400 block uppercase font-bold">Campeón del Mundo</span>
                                    <div class="text-base font-black text-emerald-400 uppercase mt-1">${arb.final.campeon}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            contenedor.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-emerald-800 to-teal-950 p-5 rounded-2xl shadow-xl border-2 border-emerald-500 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-4">
                            <img src="${data.imagen}" class="w-16 h-16 object-contain bg-slate-900/60 p-1 rounded-xl border border-emerald-400/40" alt="Logo FIFA" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=150'">
                            <div>
                                <h3 class="text-2xl font-black text-emerald-400 uppercase">MUNDIAL ${anio}</h3>
                                <p class="text-xs text-slate-300 font-bold">Sede: ${data.host}</p>
                            </div>
                        </div>
                        <div class="bg-slate-950 text-emerald-400 px-5 py-3 rounded-xl border border-emerald-500/50 font-mono text-xs min-w-[250px]">
                            <p class="flex justify-between"><span>🥇 CAMPEÓN:</span> <span class="text-white font-bold">${data.campeon}</span></p>
                            <p class="flex justify-between mt-1"><span>🥈 SUB-CAMPEÓN:</span> <span class="text-slate-300">${data.subcampeon}</span></p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center gap-4 shadow">
                            <div class="bg-emerald-500/10 p-3 rounded-full text-emerald-400 text-2xl"><i class="fa-solid fa-soccer-ball"></i></div>
                            <div>
                                <p class="text-[10px] text-slate-400 uppercase font-bold">Balón Oficial</p>
                                <p class="text-base font-black text-white">${data.balon}</p>
                            </div>
                        </div>
                        
                        <button onclick="verVideo('${data.videoId}')" class="bg-slate-900 hover:bg-slate-850 border border-slate-800 p-3 rounded-xl md:col-span-2 flex flex-col sm:flex-row justify-between items-center gap-3 w-full text-left transition group">
                            <div class="flex items-center gap-3">
                                <div class="bg-emerald-500/10 p-2.5 rounded-full text-emerald-400 text-xl"><i class="fa-solid fa-music"></i></div>
                                <div>
                                    <p class="text-[10px] text-slate-400 uppercase font-bold">Canción del Mundial</p>
                                    <p class="text-xs font-black text-white">${data.cancion}</p>
                                    <p class="text-[10px] text-emerald-400 mt-0.5"><i class="fa-brands fa-youtube mr-1"></i> Ver video de forma segura</p>
                                </div>
                            </div>
                            <div class="relative w-full sm:w-28 h-16 rounded overflow-hidden border border-slate-700 bg-black flex-shrink-0">
                                <img src="https://img.youtube.com/vi/${data.videoId}/hqdefault.jpg" class="w-full h-full object-cover" alt="Thumbnail">
                                <div class="absolute inset-0 bg-black/40 flex items-center justify-center"><i class="fa-solid fa-play text-white text-lg"></i></div>
                            </div>
                        </button>
                    </div>

                    <div class="flex border-b-2 border-slate-800 gap-2">
                        <button onclick="cambiarPestana('grupos')" class="py-2 px-5 font-black text-xs uppercase tracking-widest rounded-t-lg border-t-2 border-x-2 ${pestanaActiva === 'grupos' ? 'bg-slate-800 text-emerald-400 border-emerald-500' : 'bg-transparent text-slate-500 border-transparent hover:text-slate-300'}">Fase de Grupos</button>
                        <button onclick="cambiarPestana('eliminatoria')" class="py-2 px-5 font-black text-xs uppercase tracking-widest rounded-t-lg border-t-2 border-x-2 ${pestanaActiva === 'eliminatoria' ? 'bg-slate-800 text-emerald-400 border-emerald-500' : 'bg-transparent text-slate-500 border-transparent hover:text-slate-300'}">Camino Eliminatorio</button>
                    </div>

                    <div>${pestanaActiva === 'grupos' ? `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${htmlGrupos}</div>` : `<div>${htmlArbol}</div>`}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
