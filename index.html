<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundial Stats - El Estadio de la Historia</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Animación de la pelota rodando como el mundo al ingresar */
        @keyframes rodarMundo {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(0.2); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(-50%, -50%) rotate(1440deg) scale(1); opacity: 0; pointer-events: none; }
        }
        .loader-ball {
            animation: rodarMundo 3.5s ease-in-out forwards;
        }
        /* Textura de césped para el fondo del estadio */
        .cesped {
            background-color: #115e59;
            background-image: linear-gradient(rgba(255,255,255,0.05) 50%, transparent 50%),
                              linear-gradient(90deg, rgba(255,255,255,0.05) 50%, transparent 50%);
            background-size: 80px 80px;
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans overflow-x-hidden">

    <div id="loader" class="fixed inset-0 bg-black z-50 flex items-center justify-center transition-opacity duration-1000">
        <div class="text-center">
            <div class="relative w-64 h-64 mx-auto">
                <i class="fa-solid fa-soccer-ball text-8xl text-emerald-400 absolute top-1/2 left-1/2 loader-ball"></i>
            </div>
            <h1 class="text-3xl font-bold mt-8 tracking-wider text-emerald-400 animate-pulse">INGRESANDO AL ESTADIO...</h1>
            <p class="text-emerald-500 mt-2"><i class="fa-solid fa-whistle mr-2"></i> Prepárate para el pitazo inicial</p>
        </div>
    </div>

    <audio id="sonidoAmbiente" loop>

    </audio>
    <audio id="sonidoPitazo">

    <div class="min-h-screen flex flex-col">
        
        <header class="bg-slate-900 border-b-4 border-emerald-500 p-4 shadow-2xl">

                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-stadium text-3xl text-emerald-400"></i>
                    <h1 class="text-xl md:text-3xl font-extrabold tracking-widest text-emerald-400 uppercase">Estadísticas de los Mundiales</h1>
                </div>
                <button onclick="alternarAudio()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 px-5 rounded-full flex items-center gap-2 transition shadow-lg shadow-emerald-500/20">
                    <i id="iconoAudio" class="fa-solid fa-volume-mute"></i> <span id="textoAudio">Activar Sonido Ambiente</span>
                </button>
            </div>
        </header>

        <main class="cesped flex-grow p-4 md:p-8 relative">
            <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-11/12 h-8 border-b-2 border-x-2 border-white/10 pointer-events-none flex justify-center items-end">
                <span class="text-[10px] text-white/20 tracking-widest mb-1"><i class="fa-solid fa-door-open"></i> PORTERÍA NORTE</span>
            </div>

            <div class="container mx-auto max-w-7xl bg-slate-900/85 backdrop-blur-md rounded-3xl p-6 border-4 border-emerald-500/30 shadow-2xl mt-4">
                
                <div class="bg-emerald-950/40 p-4 rounded-xl border border-emerald-500/50 mb-6">

                        </select>
                </div>

                <div id="vistaContenido" class="min-h-[500px] transition-all duration-300"></div>

            </div>
        </main>

        <footer class="bg-slate-950 text-center p-4 border-t-4 border-emerald-700 text-slate-500 text-xs">

        // Rellenar dinámicamente las opciones
        const select = document.getElementById('selectAnio');
        Object.keys(mundialDB).forEach(anio => {
            const option = document.createElement('option');
            option.value = anio;
            option.textContent = `${anio} ${anio === "2026" ? "(Edición Actual)" : `(${mundialDB[anio].host})`}`;
            select.appendChild(option);
        });

        document.getElementById('selectAnio').value = "2026";

        window.addEventListener('DOMContentLoaded', () => {
            buscarMundial();
            setTimeout(() => {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    document.getElementById('sonidoPitazo').play().catch(() => {});
                    setTimeout(() => loader.remove(), 1000);
                }
            }, 3500);
        });

        let audioActivo = false;
        const sonidoAmbiente = document.getElementById('sonidoAmbiente');
        const iconoAudio = document.getElementById('iconoAudio');
        const textoAudio = document.getElementById('textoAudio');

        function alternarAudio() {
            if (!audioActivo) {
                sonidoAmbiente.play().catch(() => {});
                iconoAudio.className = "fa-solid fa-volume-high text-emerald-400 animate-pulse";
                textoAudio.innerText = "Mutear Estadio";
                audioActivo = true;
            } else {
                sonidoAmbiente.pause();
                iconoAudio.className = "fa-solid fa-volume-mute";
                textoAudio.innerText = "Activar Sonido Ambiente";
                audioActivo = false;
            }
        }

        function cambiarPestana(tipo) {
            pestanaActiva = tipo;
            buscarMundial();
        }

        function buscarMundial() {
            const anio = document.getElementById('selectAnio').value;
            const contenedor = document.getElementById('vistaContenido');
            
            if (!anio || !mundialDB[anio]) return;
            const data = mundialDB[anio];

            // Renderizado de la sección de Grupos
            let htmlGrupos = '';
            for (const [grupo, equipos] of Object.entries(data.grupos || {})) {
                htmlGrupos += `
                    <div class="bg-slate-800/90 p-4 rounded-xl border border-emerald-500/30 shadow-md">
                        <h4 class="font-black text-emerald-400 border-b border-slate-700 pb-2 mb-3 uppercase tracking-wide flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-list-ol"></i> ${grupo}
                        </h4>
                        <table class="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr class="text-slate-400 border-b border-slate-700 uppercase">
                                    <th class="pb-1">Selección</th>
                                    <th class="pb-1 text-center">Pts</th>
                                    <th class="pb-1 text-center">PJ</th>
                                    <th class="pb-1 text-center">PG</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${equipos.map((e, index) => `
                                    <tr class="border-b border-slate-900/60 hover:bg-slate-700/30">
                                        <td class="font-bold py-2 text-white flex items-center gap-1">
                                            <span class="text-slate-500 font-mono w-4">${index + 1}.</span> ${e.pais}
                                        </td>
                                        <td class="text-emerald-400 font-black text-center text-sm">${e.pts}</td>
                                        <td class="text-center text-slate-300">${e.pj}</td>
                                        <td class="text-center text-slate-300">${e.pg}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            // Renderizado de la sección de Eliminatorias Directas
            let htmlEliminatorias = '';

                data.faseEliminatoria.forEach(fase => {
                    htmlEliminatorias += `
                        <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-xl space-y-3">

                                ${fase.cruces.map(cruce => `
                                    <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 flex justify-between items-center text-xs font-mono">
                                        <span class="font-bold text-slate-200">${cruce.local}</span>
                                        <span class="bg-emerald-950 text-emerald-400 font-black px-3 py-1 rounded border border-emerald-500/30 text-center min-w-[70px]">${cruce.resultado}</span>
                                        <span class="font-bold text-slate-200 text-right">${cruce.visita}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });
            } else {
                htmlEliminatorias = `<div class="p-4 bg-slate-900 text-center text-slate-400 rounded-xl text-xs font-bold uppercase"><i class="fa-solid fa-circle-info mr-1"></i> Detalles extendidos en el módulo principal del marcador.</div>`;
            }

            // Estructura de la Interfaz con Pestañas

                <div class="space-y-6">
                    
                    <div class="bg-gradient-to-r from-emerald-800 to-teal-950 text-white p-5 rounded-2xl shadow-xl border-2 border-emerald-500 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-4">
                            <img src="${data.imagen}" class="w-16 h-16 object-contain bg-slate-900/60 p-1 rounded-xl border border-emerald-400/40 shadow-md" alt="Logo Oficial FIFA">
                            <div>
                                <h3 class="text-2xl font-black tracking-tighter uppercase text-emerald-400"><i class="fa-solid fa-trophy mr-1"></i> MUNDIAL ${anio}</h3>
                                <p class="text-xs uppercase tracking-widest font-bold text-slate-300"><i class="fa-solid fa-map-location-dot"></i> Sede: ${data.host}</p>
                            </div>
                        </div>
                        <div class="bg-slate-950 text-emerald-400 px-5 py-3 rounded-xl border border-emerald-500/50 font-mono text-xs shadow-inner min-w-[250px]">
                            <p class="flex justify-between"><span>🥇 CAMPEÓN:</span> <span class="text-white font-bold">${data.campeon}</span></p>
                            <p class="flex justify-between mt-1"><span>🥈 SUB-CAMPEÓN:</span> <span class="text-slate-300">${data.subcampeon}</span></p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center gap-4 shadow">
                            <div class="bg-emerald-500/10 p-3 rounded-full text-emerald-400 text-2xl">
                                <i class="fa-solid fa-soccer-ball"></i>
                            </div>
                            <div>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Balón Oficial</p>
                                <p class="text-base font-black text-white">${data.balon}</p>
                            </div>
                        </div>
                        
                        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl md:col-span-2 flex flex-col sm:flex-row justify-between items-center gap-3">
                            <div class="flex items-center gap-3">
                                <div class="bg-emerald-500/10 p-2.5 rounded-full text-emerald-400 text-xl"><i class="fa-solid fa-music"></i></div>
                                <div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Tema de la Copa</p>
                                    <p class="text-xs font-black text-white">${data.cancion}</p>
                                </div>
                            </div>
                            <a href="https://www.youtube.com/watch?v=${data.videoId}" target="_blank" class="w-full sm:w-auto bg-slate-950 hover:bg-black p-2 rounded-lg border border-slate-700 flex items-center gap-2 text-xs font-bold text-rose-500 transition group">
                                <img src="https://img.youtube.com/vi/${data.videoId}/hqdefault.jpg" class="w-14 h-10 object-cover rounded border border-slate-700 group-hover:scale-105 transition" alt="Thumbnail">
                                <span><i class="fa-brands fa-youtube mr-1"></i> VER VIDEO EN YOUTUBE</span>
                            </a>
                        </div>
                    </div>

                    <div class="flex border-b-2 border-slate-800 gap-2">
                        <button onclick="cambiarPestana('grupos')" class="py-2 px-5 font-black text-xs uppercase tracking-widest rounded-t-lg transition border-t-2 border-x-2 ${pestanaActiva === 'grupos' ? 'bg-slate-800 text-emerald-400 border-emerald-500' : 'bg-transparent text-slate-500 border-transparent hover:text-slate-300'}">
                            <i class="fa-solid fa-table-cells mr-1"></i> Fase de Grupos
                        </button>
                        <button onclick="cambiarPestana('eliminatoria')" class="py-2 px-5 font-black text-xs uppercase tracking-widest rounded-t-lg transition border-t-2 border-x-2 ${pestanaActiva === 'eliminatoria' ? 'bg-slate-800 text-emerald-400 border-emerald-500' : 'bg-transparent text-slate-500 border-transparent hover:text-slate-300'}">
                            <i class="fa-solid fa-diagram-project mr-1"></i> Camino Eliminatorio
                        </button>
                    </div>

                    <div id="seccionDinamicaPestana">
                        ${pestanaActiva === 'grupos' ? `
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${htmlGrupos}</div>
                        ` : `
                            <div class="space-y-4">${htmlEliminatorias}</div>
                        `}
                    </div>

                </div>
            `;
        }
    </script>
</body>
</html>
